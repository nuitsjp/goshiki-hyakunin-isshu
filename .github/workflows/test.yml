name: test

on:
  workflow_call: {}
  push:
    branches:
      - main
    paths:
      - ".github/workflows/test.yml"
      - "docs/js/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - ".github/workflows/test.yml"
      - "docs/js/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"

jobs:
  test:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
