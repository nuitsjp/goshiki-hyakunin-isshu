<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>五色百人一首 決まり字クイズ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="page-shell">
  <div class="container app-container py-4 d-flex flex-column">
    <header class="mb-4">
      <div class="d-flex align-items-center justify-content-between gap-2">
        <h1 class="fw-bold mb-0">五色百人一首 決まり字クイズ</h1>
        <div class="app-menu d-flex align-items-center gap-2">
          <div class="menu-wrapper">
            <button id="menu-button" class="menu-button" type="button" aria-label="メニューを開く" aria-haspopup="true"
              aria-expanded="false">
              <span id="auth-avatar-fallback" class="menu-button-icon" aria-hidden="true">
                <svg class="menu-icon" viewBox="0 0 24 24" role="presentation" aria-hidden="true">
                  <path
                    d="M12 8.75a3.25 3.25 0 1 0 0 6.5 3.25 3.25 0 0 0 0-6.5Zm8.5 3.25-.03-.6 1.58-1.15-1.4-2.42-1.84.52a6.53 6.53 0 0 0-1.04-.6l-.28-1.9h-2.8l-.28 1.9c-.36.16-.7.36-1.03.6l-1.85-.52-1.4 2.42 1.58 1.15-.03.6c0 .2.01.4.03.6L5.6 13.75l1.4 2.42 1.85-.52c.32.24.67.44 1.03.6l.28 1.9h2.8l.28-1.9c.36-.16.7-.36 1.04-.6l1.84.52 1.4-2.42-1.58-1.15.03-.6Zm-8.5 4.75a4.75 4.75 0 1 1 0-9.5 4.75 4.75 0 0 1 0 9.5Z" />
                </svg>
              </span>
              <img id="auth-avatar" class="menu-avatar hidden" alt="">
            </button>
            <div id="menu-panel" class="menu-panel hidden" role="menu">
              <button id="open-settings" class="menu-item" type="button" role="menuitem">設定</button>
              <div class="menu-divider" role="separator"></div>
              <button id="auth-login" class="menu-item" type="button" role="menuitem">ログイン</button>
              <button id="auth-logout" class="menu-item" type="button" role="menuitem">ログアウト</button>
            </div>
          </div>
          <div id="auth-message" class="auth-message" role="status" aria-live="polite"></div>
        </div>
      </div>
      <p class="text-muted mb-0 text-center">色を選んで決まり字を覚えよう</p>
    </header>

    <main class="flex-grow-1">
      <section id="start-screen" class="screen card shadow-sm">
        <div class="card-body">
          <h2 class="h4 mb-3">色を選んでください</h2>
          <div class="mb-3 d-flex flex-wrap gap-3 align-items-center">
            <div class="d-flex gap-2 align-items-center">
              <label class="form-label mb-0">読み札</label>
              <div class="btn-group" role="group" aria-label="読み札">
                <button type="button" class="btn btn-toggle active" id="order-normal" data-value="normal">上の句</button>
                <button type="button" class="btn btn-toggle" id="order-reverse" data-value="reverse">下の句</button>
              </div>
            </div>
            <div class="d-flex gap-2 align-items-center ms-auto">
              <label for="question-count" class="form-label mb-0">出題</label>
              <select id="question-count" class="form-select w-auto">
                <!-- options filled by JS -->
              </select>
            </div>
            <div class="d-flex gap-2 align-items-center">
              <label for="measure-time-toggle" class="form-label mb-0">計測</label>
              <div class="form-check form-switch mb-0">
                <input class="form-check-input" type="checkbox" id="measure-time-toggle" checked>
              </div>
            </div>
          </div>
          <div class="row g-2">
            <div class="col-12 col-md-6">
              <button class="btn w-100 color-button color-blue" data-color="青">
                <div class="color-btn-content" data-color-stats="青">青</div>
              </button>
            </div>
            <div class="col-12 col-md-6">
              <button class="btn w-100 color-button color-pink" data-color="ピンク">
                <div class="color-btn-content" data-color-stats="ピンク">ピンク</div>
              </button>
            </div>
            <div class="col-12 col-md-6">
              <button class="btn w-100 color-button color-yellow" data-color="黄">
                <div class="color-btn-content" data-color-stats="黄">黄</div>
              </button>
            </div>
            <div class="col-12 col-md-6">
              <button class="btn w-100 color-button color-green" data-color="緑">
                <div class="color-btn-content" data-color-stats="緑">緑</div>
              </button>
            </div>
            <div class="col-12 col-md-6">
              <button class="btn w-100 color-button color-orange" data-color="オレンジ">
                <div class="color-btn-content" data-color-stats="オレンジ">オレンジ</div>
              </button>
            </div>
          </div>
          <div class="row g-2 mt-2">
            <div class="col-12">
              <button id="view-stats" class="btn btn-outline-secondary w-100">📊 統計を見る</button>
            </div>
          </div>
        </div>
      </section>

      <section id="quiz-screen" class="screen card shadow-sm hidden">
        <div class="card-body">
          <div class="d-flex align-items-center gap-2 flex-wrap mb-2">
            <div id="progress-text" class="fw-semibold">問題 1 / 20</div>
            <div class="ms-auto d-flex align-items-center gap-2 flex-wrap">
              <div id="elapsed-time" class="elapsed-time-badge">0:00</div>
              <div id="selected-color-label" class="badge selected-color-badge"></div>
              <button id="cancel-quiz" class="btn btn-outline-secondary btn-sm quiz-cancel-btn" type="button"
                aria-label="クイズを中止してトップへ" title="トップに戻る">×</button>
            </div>
          </div>
          <div class="progress mb-3" role="progressbar" aria-label="進捗">
            <div id="progress-bar" class="progress-bar" style="width: 0%;"></div>
          </div>
          <div class="card quiz-card">
            <div class="card-body">
              <div class="d-flex align-items-center flex-wrap gap-2 mb-1">
                <div id="main-display-label" class="text-muted small mb-0">決まり字</div>
                <button id="toggle-kimariji" class="btn btn-sm btn-outline-secondary ms-auto" type="button"
                  aria-pressed="false">⇆ ヒント表示</button>
              </div>
              <div id="kimariji" class="kimariji-display mb-3">---</div>
              <div class="text-muted small mb-2">下の句を選んでください</div>
              <div id="options-container" class="d-grid gap-2">
                <button class="btn option-button" data-index="0"></button>
                <button class="btn option-button" data-index="1"></button>
                <button class="btn option-button" data-index="2"></button>
                <button class="btn option-button" data-index="3"></button>
              </div>
              <div id="feedback" class="mt-3 fw-semibold"></div>
              <div id="auto-advance-progress" class="auto-advance-progress hidden">
                <div class="auto-advance-bar"></div>
              </div>
              <div class="d-flex justify-content-between align-items-center mt-3">
                <button id="give-up-button" class="btn btn-outline-warning pass-button">パス</button>
                <button id="next-question" class="btn btn-primary next-button" type="button" disabled>次へ</button>
              </div>

            </div>
          </div>
        </div>
      </section>

      <section id="settings-screen" class="screen card shadow-sm hidden">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h4 mb-0">設定</h2>
            <button id="close-settings" class="btn btn-outline-secondary btn-sm">閉じる</button>
          </div>
          <div class="d-flex flex-column gap-3">
            <div class="d-flex gap-2 align-items-center flex-wrap">
              <label for="hint-type" class="form-label mb-0">ヒント</label>
              <select id="hint-type" class="form-select w-auto">
                <option value="shoku" selected>初句</option>
                <option value="kami">上の句</option>
              </select>
            </div>
            <div class="d-flex gap-2 align-items-center flex-wrap">
              <label for="display-mode" class="form-label mb-0">表示</label>
              <select id="display-mode" class="form-select w-auto">
                <option value="kana" selected>よみがな</option>
                <option value="kanji">漢字</option>
              </select>
            </div>
          </div>
        </div>
      </section>

      <section id="result-screen" class="screen card shadow-sm hidden">
        <div class="card-body text-center">
          <h2 class="h4 mb-3">結果発表</h2>
          <div class="display-6 fw-bold" id="result-count">-- / 20 問正解</div>
          <div class="h5 text-muted" id="result-rate">正答率 --%</div>
          <div class="mt-2 mb-4 fw-semibold" id="result-comment">---</div>
          <div class="d-grid gap-2 d-sm-flex justify-content-center mb-3">
            <button id="retry-same" class="btn btn-primary">同じ色で再挑戦</button>
            <button id="retry-incorrect" class="btn btn-warning hidden">不正解を再挑戦！</button>
            <button id="choose-color" class="btn btn-outline-secondary">別の色を選ぶ</button>
          </div>
          <div class="text-center mb-3">
            <button id="view-stats-from-result" class="btn btn-outline-secondary">📊 統計を見る</button>
          </div>
          <div id="result-list" class="result-list text-start" aria-live="polite"></div>
        </div>
      </section>

      <section id="stats-screen" class="screen card shadow-sm hidden">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h4 mb-0">統計情報</h2>
            <button id="close-stats" class="btn btn-outline-secondary btn-sm">閉じる</button>
          </div>

          <div class="mb-3 d-flex gap-2 align-items-center">
            <label class="form-label mb-0">フィルター（読み札）</label>
            <div class="btn-group" role="group" aria-label="統計フィルター">
              <button type="button" class="btn btn-toggle btn-sm active" id="stats-filter-normal"
                data-value="normal">上の句</button>
              <button type="button" class="btn btn-toggle btn-sm" id="stats-filter-reverse"
                data-value="reverse">下の句</button>
            </div>
          </div>

          <div class="stats-summary mb-4">
            <div class="row g-3">
              <div class="col-6 col-md-3">
                <div class="stat-card">
                  <div class="stat-label">総プレイ回数</div>
                  <div class="stat-value" id="total-quizzes">-</div>
                </div>
              </div>
              <div class="col-6 col-md-3">
                <div class="stat-card">
                  <div class="stat-label">総問題数</div>
                  <div class="stat-value" id="total-questions">-</div>
                </div>
              </div>
              <div class="col-6 col-md-3">
                <div class="stat-card">
                  <div class="stat-label">正解数</div>
                  <div class="stat-value" id="total-correct">-</div>
                </div>
              </div>
              <div class="col-6 col-md-3">
                <div class="stat-card">
                  <div class="stat-label">平均正答率</div>
                  <div class="stat-value" id="overall-accuracy">-%</div>
                </div>
              </div>
              <div class="col-6 col-md-3">
                <div class="stat-card">
                  <div class="stat-label">ヒント利用率</div>
                  <div class="stat-value" id="overall-hint-usage">-%</div>
                </div>
              </div>
            </div>
          </div>

          <h3 class="h5 mb-3">色別統計</h3>
          <p class="text-muted small mb-2">※行をクリックすると詳細統計が表示されます</p>
          <div class="table-responsive mb-4">
            <table class="table table-sm stats-table">
              <thead>
                <tr>
                  <th class="stats-header">プレイ回数</th>
                  <th class="stats-header">問題数</th>
                  <th class="stats-header">正解数</th>
                  <th class="stats-header">正答率</th>
                  <th class="stats-header">ヒント利用率</th>
                  <th class="stats-header">最速</th>
                  <th class="stats-header">最終プレイ</th>
                </tr>
              </thead>
              <tbody id="color-stats-tbody">
              </tbody>
            </table>
          </div>

          <!-- 色別詳細統計パネル -->
          <div id="color-detail-container" class="mb-4"></div>

          <h3 class="h5 mb-3">最近の履歴</h3>
          <div id="recent-activity" class="recent-activity-list">
          </div>

          <div class="mt-4 text-center">
            <button id="clear-history" class="btn btn-outline-danger btn-sm">履歴をクリア</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <footer class="container text-center py-3 text-muted small">
    <span>Version: <span id="app-version">v0.1.6</span></span>
    <span class="ms-2">|</span>
    <a href="credits.html" class="ms-2 text-decoration-none text-muted">OSSライセンス</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>

</html>
