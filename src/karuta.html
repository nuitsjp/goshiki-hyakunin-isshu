<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>五色百人一首 競技かるた</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="page-shell karuta-page">
  <div class="container app-container py-4 d-flex flex-column">
    <header class="mb-4">
      <div class="d-flex align-items-center justify-content-between gap-2">
        <h1 class="fw-bold mb-0">五色百人一首 競技かるた</h1>
      </div>
      <p class="text-muted mb-0 text-center">読み札を聞いて、対応する取り札を選ぼう</p>
    </header>

    <main class="flex-grow-1">
      <section id="start-screen" class="screen card shadow-sm">
        <div class="card-body">
          <div class="d-flex align-items-center justify-content-between gap-2 mb-3">
            <h2 class="h4 mb-0">色を選んでください</h2>
            <a href="index.html" class="btn btn-outline-secondary btn-sm">クイズへ</a>
          </div>
          <div class="d-flex align-items-center gap-2 flex-wrap mb-3">
            <p class="text-muted mb-0">選んだ色の20枚すべての札で遊びます</p>
            <div class="d-flex gap-2 align-items-center ms-auto">
              <label for="measure-time-toggle" class="form-label mb-0">計測</label>
              <div class="form-check form-switch mb-0">
                <input class="form-check-input" type="checkbox" id="measure-time-toggle" checked>
              </div>
            </div>
          </div>
          <div class="row g-2">
            <div class="col-12 col-md-6">
              <button class="btn w-100 color-button color-blue" data-color="青">
                <div class="color-btn-content">青</div>
              </button>
            </div>
            <div class="col-12 col-md-6">
              <button class="btn w-100 color-button color-pink" data-color="ピンク">
                <div class="color-btn-content">ピンク</div>
              </button>
            </div>
            <div class="col-12 col-md-6">
              <button class="btn w-100 color-button color-yellow" data-color="黄">
                <div class="color-btn-content">黄</div>
              </button>
            </div>
            <div class="col-12 col-md-6">
              <button class="btn w-100 color-button color-green" data-color="緑">
                <div class="color-btn-content">緑</div>
              </button>
            </div>
            <div class="col-12 col-md-6">
              <button class="btn w-100 color-button color-orange" data-color="オレンジ">
                <div class="color-btn-content">オレンジ</div>
              </button>
            </div>
          </div>
        </div>
      </section>

      <section id="game-screen" class="screen card shadow-sm hidden">
        <div class="card-body d-flex flex-column">
          <div class="card quiz-card karuta-board flex-grow-1">
            <div class="card-body">
              <div class="karuta-layout">
                <div class="karuta-progress-row">
                  <div class="d-flex align-items-center gap-2 flex-wrap karuta-info-container">
                    <div id="progress-text" class="fw-semibold">1 / 20</div>
                    <div class="ms-auto d-flex align-items-center gap-2 flex-wrap">
                      <div id="elapsed-time" class="elapsed-time-badge">0:00</div>
                      <div id="score-text" class="badge bg-success">正解: 0枚</div>
                      <div id="selected-color-label" class="badge selected-color-badge"></div>
                      <button id="cancel-game" class="btn btn-outline-secondary btn-sm quiz-cancel-btn" type="button"
                        aria-label="ゲームを中止してトップへ" title="トップに戻る">×</button>
                    </div>
                  </div>
                  <div class="progress karuta-progress-bar" role="progressbar" aria-label="進捗">
                    <div id="progress-bar" class="progress-bar" style="width: 0%;"></div>
                  </div>
                </div>

                <div class="karuta-board-top karuta-reading-row">
                  <div class="d-flex align-items-center flex-wrap karuta-label-row">
                    <div class="text-muted small mb-0">決まり字</div>
                    <button id="toggle-hint" class="btn btn-sm btn-outline-secondary ms-auto hint-button" type="button"
                      aria-pressed="false">
                      <i class="bi bi-arrow-left-right hint-icon" aria-hidden="true"></i>
                      <span class="hint-button-label">ヒント</span>
                    </button>
                  </div>
                  <div class="display-panel">
                    <div id="kimariji-display" class="kimariji-display mb-2">---</div>
                    <div id="reading-display" class="reading-display mb-2">---</div>
                  </div>
                </div>

                <div class="karuta-grid-area">
                  <div id="karuta-grid" class="karuta-grid">
                    <!-- Cards will be dynamically generated here -->
                  </div>
                </div>

                <div class="karuta-board-bottom karuta-action-row">
                  <div class="d-flex justify-content-center mt-3 karuta-action-container" style="display: none;">
                    <button id="next-reading" class="btn btn-primary next-button" type="button" disabled>次の札へ</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section id="result-screen" class="screen card shadow-sm hidden">
        <div class="card-body text-center">
          <h2 class="h4 mb-3">結果発表</h2>
          <div class="display-6 fw-bold" id="result-count">-- / 20 枚獲得</div>
          <div class="h5 text-muted" id="result-rate">正答率 --%</div>
          <div id="result-time" class="elapsed-time-badge d-inline-block mt-2 hidden">クリアタイム --</div>
          <div class="mt-2 mb-4 fw-semibold" id="result-comment">---</div>
          <div class="d-grid gap-2 d-sm-flex justify-content-center mb-3">
            <button id="retry-same" class="btn btn-primary">同じ色で再挑戦</button>
            <button id="choose-color" class="btn btn-outline-secondary">別の色を選ぶ</button>
          </div>
          <div id="result-list" class="result-list text-start" aria-live="polite"></div>
        </div>
      </section>
    </main>
  </div>

  <footer class="container text-center py-3 text-muted small">
    <span>Version: <span id="app-version">0.0.0</span></span>
    <span class="ms-2">|</span>
    <a href="credits.html" class="ms-2 text-decoration-none text-muted">OSSライセンス</a>
    <span class="ms-2">|</span>
    <a href="privacy.html" class="ms-2 text-decoration-none text-muted">プライバシーポリシー</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/karuta-app.js"></script>
</body>

</html>
