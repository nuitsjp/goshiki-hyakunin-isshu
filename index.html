<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>五色百人一首 決まり字クイズ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container py-4 d-flex flex-column min-vh-100">
    <header class="mb-4 text-center">
      <h1 class="fw-bold">五色百人一首 決まり字クイズ</h1>
      <p class="text-muted mb-0">色を選んで決まり字を覚えよう</p>
    </header>

    <main class="flex-grow-1">
      <section id="start-screen" class="screen card shadow-sm">
        <div class="card-body">
          <h2 class="h4 mb-3">色を選んでください</h2>
          <div class="mb-3 d-flex flex-column flex-md-row gap-2 align-items-md-center">
            <label for="question-count" class="form-label mb-0">出題数</label>
            <select id="question-count" class="form-select w-auto">
              <!-- options filled by JS -->
            </select>
            <div class="text-muted small">1〜20問から選択（デフォルト: 20）</div>
          </div>
          <div class="row g-2">
            <div class="col-12 col-md-6">
              <button class="btn w-100 color-button color-blue" data-color="青">青（20首）</button>
            </div>
            <div class="col-12 col-md-6">
              <button class="btn w-100 color-button color-pink" data-color="ピンク">ピンク（20首）</button>
            </div>
            <div class="col-12 col-md-6">
              <button class="btn w-100 color-button color-yellow" data-color="黄">黄（20首）</button>
            </div>
            <div class="col-12 col-md-6">
              <button class="btn w-100 color-button color-green" data-color="緑">緑（20首）</button>
            </div>
            <div class="col-12 col-md-6">
              <button class="btn w-100 color-button color-orange" data-color="オレンジ">オレンジ（20首）</button>
            </div>
          </div>
        </div>
      </section>

      <section id="quiz-screen" class="screen card shadow-sm hidden">
        <div class="card-body">
          <div class="d-flex align-items-center gap-2 flex-wrap mb-2">
            <div id="progress-text" class="fw-semibold">問題 1 / 20</div>
            <div class="ms-auto d-flex align-items-center gap-2 flex-wrap">
              <div id="selected-color-label" class="badge selected-color-badge"></div>
              <button id="cancel-quiz" class="btn btn-outline-secondary btn-sm quiz-cancel-btn" type="button" aria-label="クイズを中止してトップへ" title="トップに戻る">×</button>
            </div>
          </div>
          <div class="progress mb-3" role="progressbar" aria-label="進捗">
            <div id="progress-bar" class="progress-bar" style="width: 0%;"></div>
          </div>
          <div class="card quiz-card">
            <div class="card-body">
              <div class="d-flex align-items-center flex-wrap gap-2 mb-1">
                <div class="text-muted small mb-0">決まり字</div>
                <button id="toggle-kimariji" class="btn btn-sm btn-outline-secondary ms-auto" type="button" aria-pressed="false">⇆ 上の句表示</button>
              </div>
              <div id="kimariji" class="kimariji-display mb-3">---</div>
              <div class="text-muted small mb-2">下の句を選んでください</div>
              <div id="options-container" class="d-grid gap-2">
                <button class="btn option-button" data-index="0"></button>
                <button class="btn option-button" data-index="1"></button>
                <button class="btn option-button" data-index="2"></button>
                <button class="btn option-button" data-index="3"></button>
              </div>
              <div id="feedback" class="mt-3 fw-semibold"></div>
              <div class="d-flex justify-content-end mt-2">
                <button id="next-question" class="btn btn-primary next-button" type="button" disabled>次へ</button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section id="result-screen" class="screen card shadow-sm hidden">
        <div class="card-body text-center">
          <h2 class="h4 mb-3">結果発表</h2>
          <div class="display-6 fw-bold" id="result-count">-- / 20 問正解</div>
          <div class="h5 text-muted" id="result-rate">正答率 --%</div>
          <div class="mt-2 mb-4 fw-semibold" id="result-comment">---</div>
          <div class="d-grid gap-2 d-sm-flex justify-content-center mb-3">
            <button id="retry-same" class="btn btn-primary">同じ色で再挑戦</button>
            <button id="choose-color" class="btn btn-outline-secondary">別の色を選ぶ</button>
          </div>
          <div id="result-list" class="result-list text-start" aria-live="polite"></div>
        </div>
      </section>
    </main>
  </div>

  <footer class="container text-center py-3 text-muted small">
    <span>Version: <span id="app-version">v0.0.19</span></span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
