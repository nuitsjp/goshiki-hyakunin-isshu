<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>五色百人一首 決まり字クイズ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-2QpVu7YjDdyCjTiMQuuLHfoalvVYLRNvKpcJsteVEh9UpAJZciV06P88GJEHhpGb" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container py-4">
    <header class="mb-4 text-center">
      <h1 class="fw-bold">五色百人一首 決まり字クイズ <span id="app-version" class="badge bg-secondary align-middle">v0.0.1</span></h1>
      <p class="text-muted mb-0">色を選んで決まり字を覚えよう</p>
    </header>

    <main>
      <section id="start-screen" class="screen card shadow-sm">
        <div class="card-body">
          <h2 class="h4 mb-3">色を選んでください</h2>
          <div class="row g-2">
            <div class="col-12 col-md-6">
              <button class="btn w-100 color-button color-blue" data-color="青">青（20首）</button>
            </div>
            <div class="col-12 col-md-6">
              <button class="btn w-100 color-button color-pink" data-color="ピンク">ピンク（20首）</button>
            </div>
            <div class="col-12 col-md-6">
              <button class="btn w-100 color-button color-yellow" data-color="黄">黄（20首）</button>
            </div>
            <div class="col-12 col-md-6">
              <button class="btn w-100 color-button color-green" data-color="緑">緑（20首）</button>
            </div>
            <div class="col-12 col-md-6">
              <button class="btn w-100 color-button color-orange" data-color="オレンジ">オレンジ（20首）</button>
            </div>
          </div>
          <div class="mt-3 small text-muted">
            CSV: <code>data/hyakunin_isshu_with_ruby.csv</code> をロードします。
          </div>
        </div>
      </section>

      <section id="quiz-screen" class="screen card shadow-sm hidden">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <div id="progress-text" class="fw-semibold">問題 1 / 20</div>
            <div id="selected-color-label" class="badge bg-secondary"></div>
          </div>
          <div class="progress mb-3" role="progressbar" aria-label="進捗">
            <div id="progress-bar" class="progress-bar" style="width: 0%;"></div>
          </div>
          <div class="card quiz-card">
            <div class="card-body">
              <div class="text-muted small mb-1">決まり字</div>
              <div id="kimariji" class="kimariji-display mb-3">---</div>
              <div class="text-muted small mb-2">下の句を選んでください</div>
              <div id="options-container" class="d-grid gap-2">
                <button class="btn option-button" data-index="0"></button>
                <button class="btn option-button" data-index="1"></button>
                <button class="btn option-button" data-index="2"></button>
                <button class="btn option-button" data-index="3"></button>
              </div>
              <div id="feedback" class="mt-3 fw-semibold"></div>
            </div>
          </div>
        </div>
      </section>

      <section id="result-screen" class="screen card shadow-sm hidden">
        <div class="card-body text-center">
          <h2 class="h4 mb-3">結果発表</h2>
          <div class="display-6 fw-bold" id="result-count">-- / 20 問正解</div>
          <div class="h5 text-muted" id="result-rate">正答率 --%</div>
          <div class="mt-2 mb-4 fw-semibold" id="result-comment">---</div>
          <div class="d-grid gap-2 d-sm-flex justify-content-center">
            <button id="retry-same" class="btn btn-primary">同じ色で再挑戦</button>
            <button id="choose-color" class="btn btn-outline-secondary">別の色を選ぶ</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js" integrity="sha384-yqfN5Fxo15zJY4bP3y5kIYAQ0E1YNy27FIRygTcW9DSxC+kYRs2cjB7Kqbj7PHL8" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-Gws35Bf1tZe65iL8Gr7Z84qxdjQbaO5SpM90+hCbGyF/F7kh/3Gzdh0d3ba939E1" crossorigin="anonymous"></script>
  <script src="js/app.js"></script>
</body>
</html>
